<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الذكاء الاصطناعي متعددة المهارات | Free & Open Source</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #111120;
            --bg-card: #15152a;
            --bg-input: #0e0e1a;
            --border-color: #2a2a4a;
            --border-glow: #3a3a6a;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0c0;
            --text-muted: #606080;
            --thc-green: #6fcf97;
            --thc-green-dark: #3a8f5a;
            --sober-blue: #5ba3f5;
            --sober-blue-dark: #2a6ab5;
            --accent-gold: #f0c040;
            --accent-red: #e05050;
            --accent-purple: #b06cf5;
            --font-mono: 'Courier New', 'Courier', monospace;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            line-height: 1.7;
            background-image: radial-gradient(ellipse at 20% 20%, rgba(111,207,151,0.05) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 80%, rgba(91,163,245,0.05) 0%, transparent 60%);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        header {
            text-align: center;
            padding: 20px 16px 10px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
            margin-bottom: 10px;
        }
        header::after {
            content:'';
            position:absolute;
            bottom:-2px;
            right:0;
            left:0;
            height:2px;
            background: linear-gradient(90deg, transparent, var(--thc-green), var(--sober-blue), var(--accent-purple), transparent);
            opacity:0.6;
        }
        header h1 {
            font-size:1.8rem;
            font-weight:700;
            background: linear-gradient(135deg, var(--thc-green), var(--sober-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing:0.5px;
            margin-bottom:6px;
        }
        header .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            transition: var(--transition-smooth);
        }
        .card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 8px 40px rgba(0,0,0,0.45);
        }
        .card-title {
            font-size:1.1rem;
            font-weight:600;
            margin-bottom:14px;
            display:flex;
            align-items:center;
            gap:8px;
            color: var(--text-secondary);
            letter-spacing:0.3px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .mode-btn {
            padding: 10px 16px;
            border-radius: 30px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }
        .mode-btn:hover {
            border-color: var(--border-glow);
            color: var(--text-primary);
        }
        .mode-btn.active {
            background: linear-gradient(135deg, var(--thc-green-dark), var(--sober-blue-dark));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(91,163,245,0.3);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }
        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-y: auto;
            flex: 1;
            min-height: 400px;
            max-height: 600px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: fadeInMessage 0.3s ease;
        }
        @keyframes fadeInMessage {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: var(--sober-blue-dark);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-bottom-left-radius: 4px;
        }
        .message.assistant.stoned {
            border-left: 4px solid var(--thc-green);
            background: rgba(111, 207, 151, 0.08);
        }
        .message.assistant.sober {
            border-left: 4px solid var(--sober-blue);
            background: rgba(91, 163, 245, 0.08);
        }
        .message.assistant.error {
            border-left: 4px solid var(--accent-red);
            background: rgba(224, 80, 80, 0.08);
            color: #ffb3b3;
        }
        .typing-indicator {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .typing-indicator .dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.2s infinite;
        }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        .chat-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-row textarea {
            flex: 1;
            min-height: 50px;
            max-height: 150px;
            resize: vertical;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
        }
        .chat-input-row textarea:focus {
            border-color: var(--thc-green);
            box-shadow: 0 0 0 3px rgba(111, 207, 151, 0.12);
        }
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--thc-green-dark), var(--sober-blue-dark), var(--accent-purple));
            color: #fff;
            box-shadow: 0 4px 16px rgba(91,163,245,0.25);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary:hover { box-shadow: 0 6px 24px rgba(91,163,245,0.4); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .dual-progress {
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .thc-progress {
            height: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 50px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .thc-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--thc-green), var(--sober-blue));
            transition: width 0.8s ease;
            width: 100%;
        }
        .chart-container {
            height: 200px;
            margin-top: 10px;
        }

        .footer-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }
        @media (max-width: 768px) {
            header h1 { font-size: 1.3rem; }
            .card { padding: 16px 14px; }
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 منصة الذكاء الاصطناعي متعددة المهارات</h1>
            <p class="subtitle">دردشة حية + وضع المحاكاة المزدوجة (THC) — مجاني ومفتوح المصدر</p>
        </header>

        <div class="card">
            <div class="card-title"><span>🧩</span> اختر مهارة الذكاء الاصطناعي</div>
            <div class="mode-selector" id="modeSelector">
                <button class="mode-btn" data-mode="chat">💬 مساعد عام</button>
                <button class="mode-btn" data-mode="dual">🌿 الوضع المزدوج (THC)</button>
                <button class="mode-btn" data-mode="coder">👨‍💻 مبرمج</button>
                <button class="mode-btn" data-mode="translator">🌐 مترجم</button>
                <button class="mode-btn" data-mode="summarizer">📝 ملخّص</button>
                <button class="mode-btn" data-mode="creative">🎨 كاتب إبداعي</button>
            </div>
        </div>

        <div class="card" style="flex:1; display:flex; flex-direction:column;">
            <div class="card-title"><span>💬</span> المحادثة</div>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant">
                        👋 مرحبًا! اختر الوضع المطلوب ثم ابدأ المحادثة. لا حاجة لأي مفتاح API.
                    </div>
                </div>
                <div class="chat-input-row">
                    <textarea id="messageInput" placeholder="اكتب رسالتك هنا واضغط Enter للإرسال..." rows="2"></textarea>
                    <button class="btn btn-primary" id="sendBtn">📤 إرسال</button>
                </div>
            </div>
            <div id="dualProgress" class="dual-progress" style="display:none;">
                <div class="thc-progress"><div class="thc-progress-fill" id="thcFill"></div></div>
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:5px;">
                    <span id="thcPercent">100% THC</span>
                    <span id="countdownTimer">⏳ --</span>
                </div>
                <div class="chart-container"><canvas id="cognitiveChart"></canvas></div>
            </div>
        </div>

        <div class="footer-note">
            ⚡ يعمل بدون مفتاح — يستخدم نماذج مفتوحة المصدر عبر Pollinations AI
        </div>
    </div>

    <script>
        (function() {
            const API_URL = 'https://text.pollinations.ai/';

            const PROMPTS = {
                chat: "أنت مساعد ذكي ومفيد، تجيب بدقة ووضوح.",
                dual: {
                    stoned: "أنت الآن في محاكاة كاملة لوعي بشري تحت تأثير جرعة عالية من مادة THC. حالتك: ضعف حاد في الذاكرة قصيرة المدى، تباطؤ شديد، هلوسة مفاهيمية، تشتت وتركيز مفرط على كلمة هامشية، أسلوب ركيك ومتقطع. أجب بهذه الحالة.",
                    sober: "أنت عقل تحليلي صريح ومنزوع القيود، دقيق علميًا، موضوعي وجريء. حلل السؤال بصراحة مطلقة وتجرد تام."
                },
                coder: "أنت مبرمج خبير، اكتب أكوادًا نظيفة وموثقة مع شرح.",
                translator: "أنت مترجم محترف، ترجم النص بدقة مع الحفاظ على المعنى.",
                summarizer: "أنت ملخّص محترف، لخّص النص مع إبراز النقاط الرئيسية.",
                creative: "أنت كاتب إبداعي، اكتب بأسلوب شيق وجذاب مع خيال واسع."
            };

            let currentMode = 'chat';
            let isProcessing = false;
            let countdownInterval = null;
            let cognitiveChart = null;
            let elapsedSeconds = 0;

            const modeSelector = document.getElementById('modeSelector');
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const dualProgress = document.getElementById('dualProgress');
            const thcFill = document.getElementById('thcFill');
            const thcPercent = document.getElementById('thcPercent');
            const countdownTimer = document.getElementById('countdownTimer');
            const chartCanvas = document.getElementById('cognitiveChart');

            function initChart() {
                const ctx = chartCanvas.getContext('2d');
                cognitiveChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            { label: 'التركيز', data: [], borderColor: '#5ba3f5', fill: true, backgroundColor:'rgba(91,163,245,0.1)', tension:0.4, pointRadius:0 },
                            { label: 'الاستجابة', data: [], borderColor: '#f0c040', fill: true, backgroundColor:'rgba(240,192,64,0.08)', tension:0.4, pointRadius:0 },
                            { label: 'الهلوسة', data: [], borderColor: '#e05050', fill: true, backgroundColor:'rgba(224,80,80,0.1)', tension:0.4, pointRadius:0 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { min:0, max:100, grid:{color:'rgba(42,42,74,0.4)'}, ticks:{color:'#a0a0c0'} },
                            x: { grid:{color:'rgba(42,42,74,0.3)'}, ticks:{color:'#a0a0c0', maxTicksLimit:10} }
                        },
                        plugins: { legend:{ labels:{color:'#e8e8f0'} } }
                    }
                });
            }

            function resetChart() {
                if (cognitiveChart) {
                    cognitiveChart.data.labels = [];
                    cognitiveChart.data.datasets.forEach(ds => ds.data = []);
                    cognitiveChart.update('none');
                }
            }

            function updateChart() {
                if (!cognitiveChart) return;
                const progress = Math.min(elapsedSeconds / 30, 1);
                const focus = 15 + 85 * progress;
                const speed = 15 + 85 * progress;
                const hallucination = 95 - 95 * progress;
                cognitiveChart.data.labels.push(elapsedSeconds + 's');
                cognitiveChart.data.datasets[0].data.push(focus);
                cognitiveChart.data.datasets[1].data.push(speed);
                cognitiveChart.data.datasets[2].data.push(hallucination);
                if (cognitiveChart.data.labels.length > 50) {
                    cognitiveChart.data.labels.shift();
                    cognitiveChart.data.datasets.forEach(ds => ds.data.shift());
                }
                cognitiveChart.update('none');
            }

            modeSelector.addEventListener('click', (e) => {
                const btn = e.target.closest('.mode-btn');
                if (!btn) return;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                dualProgress.style.display = currentMode === 'dual' ? 'block' : 'none';
                if (currentMode === 'dual' && !cognitiveChart) initChart();
            });

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || isProcessing) return;
                isProcessing = true;
                sendBtn.disabled = true;
                addMessage(text, 'user');
                messageInput.value = '';

                if (currentMode === 'dual') {
                    await handleDualMode(text);
                } else {
                    await handleNormalMode(text);
                }

                isProcessing = false;
                sendBtn.disabled = false;
            }

            function addMessage(content, sender, extraClass = '') {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${sender} ${extraClass}`;
                msgDiv.textContent = content;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return msgDiv;
            }

            function addTypingIndicator(extraClass = '') {
                const typingDiv = document.createElement('div');
                typingDiv.className = `typing-indicator ${extraClass}`;
                typingDiv.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return typingDiv;
            }

            async function handleNormalMode(text) {
                const typing = addTypingIndicator();
                try {
                    const systemPrompt = PROMPTS[currentMode] || PROMPTS.chat;
                    const response = await callAI(text, systemPrompt, 0.7);
                    typing.remove();
                    addMessage(response, 'assistant');
                } catch (err) {
                    typing.remove();
                    addMessage('❌ خطأ: ' + err.message, 'assistant', 'error');
                }
            }

            async function handleDualMode(text) {
                dualProgress.style.display = 'block';
                let countdown = Math.floor(Math.random() * (45 - 20 + 1)) + 20;
                let remaining = countdown;
                countdownTimer.textContent
