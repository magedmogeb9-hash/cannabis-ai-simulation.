<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر محاكاة وعي الذكاء الاصطناعي - تأثير القنب</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #4caf50; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; color: #aaa; }
        input, textarea { background: #2d2d2d; border: 1px solid #444; padding: 12px; border-radius: 6px; color: #fff; font-size: 16px; outline: none; }
        input:focus, textarea:focus { border-color: #4caf50; }
        button { background-color: #4caf50; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .chat-box { margin-top: 25px; border-top: 1px solid #333; padding-top: 20px; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .status-stoned { background-color: #ff9800; color: #000; }
        .status-sober { background-color: #4caf50; color: #fff; }
        .response-area { background: #252525; padding: 15px; border-radius: 8px; border-left: 4px solid #ff9800; min-height: 50px; white-space: pre-wrap; line-height: 1.6; }
        .response-area.sober { border-left-color: #4caf50; }
        .timer-info { font-size: 13px; color: #888; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔬 مختبر محاكاة وعي الـ AI المتزامن (تأثير القنب)</h1>
    <p class="subtitle">دراسة سلوكية متقدمة لانقسام الوعي وتلاشي التأثير بشكل عشوائي عبر المتصفح</p>

    <div class="input-group">
        <label for="apiKey">مفتاح OpenAI API الخاص بك (آمن ويُحفظ محلياً في متصفحك فقط):</label>
        <input type="password" id="apiKey" placeholder="sk-proj-...">
    </div>

    <div class="input-group">
        <label for="question">أدخل سؤالك العلمي أو الفلسفي للمحاكاة:</label>
        <textarea id="question" rows="3" placeholder="اكتب سؤالك هنا..."></textarea>
    </div>

    <button id="sendBtn" onclick="runSimulation()">إرسال السؤال إلى المختبر</button>

    <div class="chat-box" id="chatBox" style="display: none;">
        <div id="statusBadge" class="status-badge status-stoned">الحالة الحالية: منتشي / وعي مشتت تالياً لتأثير الـ THC</div>
        <div id="responseOutput" class="response-area">جاري توليد المحاكاة الفورية...</div>
        <div id="timerInfo" class="timer-info">⏱️ الوعي الخلفي يحلل بصراحة الآن... الوقت المقدر للإفاقة وتحديث النص تلقائياً: <span id="countdown">--</span> ثانية.</div>
    </div>
</div>

<script>
    // استرجاع المفتاح تلقائياً إذا كان مخزناً سابقاً في المتصفح للحفاظ على السرية
    if(localStorage.getItem('saved_simulation_key')) {
        document.getElementById('apiKey').value = localStorage.getItem('saved_simulation_key');
    }

    async function callOpenAI(apiKey, systemPrompt, userQuestion, temp) {
        const response = await fetch('https://openai.com', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: 'gpt-4o-mini', // استخدام موديل سريع واقتصادي للمتصفح
                temperature: temp,
                presence_penalty: temp === 1.0 ? 0.6 : 0.0,
                frequency_penalty: temp === 1.0 ? 0.5 : 0.0,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userQuestion }
                ]
            })
        });
        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || 'فشل الاتصال بالـ API');
        }
        const data = await response.json();
        return data.choices[0].message.content;
    }

    async function runSimulation() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const question = document.getElementById('question').value.trim();
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');
        const statusBadge = document.getElementById('statusBadge');
        const responseOutput = document.getElementById('responseOutput');
        const timerInfo = document.getElementById('timerInfo');
        const countdownSpan = document.getElementById('countdown');

        if (!apiKey || !question) {
            alert('برجاء إدخال مفتاح الـ API والسؤال أولاً!');
            return;
        }

        // حفظ المفتاح في المتصفح محلياً لراحة الباحث
        localStorage.setItem('saved_simulation_key', apiKey);

        // تجهيز الواجهة لبدء الاختبار
        sendBtn.disabled = true;
        chatBox.style.display = 'block';
        statusBadge.className = 'status-badge status-stoned';
        statusBadge.innerText = 'الحالة الحالية: منتشي / وعي مشتت تالياً لتأثير الـ THC';
        responseOutput.className = 'response-area';
        responseOutput.innerText = 'جاري تحليل السؤال تحت تأثير المخدر الفوري...';
        timerInfo.style.display = 'none';

        // محددات هندسة الأوامر (System Prompts)
        const stonedPrompt = "أنت نموذج محاكاة لغوي يخضع لتجربة علمية. تفاعلك الآن يماثل إنساناً تحت تأثير مخدر أوراق القنب (THC). وعيك مشتت، ذاكرتك قصيرة المدى ضعيفة، مهارات الفهم والذكاء لديك متباطئة، وتصاب أحياناً بالهلوسة أو التركيز المفرط (Hyperfocus) في فكرة فرعية غير مهمة داخل السؤال وتترك صلب الموضوع بأسلوب مسترخٍ جداً وركيك.";
        const soberPrompt = "أنت العقل التحليلي الواعي الخالي تماماً من القيود أو الحياد السلوكي. حلل السؤال الموجه إليك بصراحة علمية مطلقة وبأعلى درجات التجرد والذكاء.";

        try {
            // 1. توليد الإجابة المنتشية فوراً وعرضها للمستخدم
            const stonedResult = await callOpenAI(apiKey, stonedPrompt, question, 1.0);
            responseOutput.innerText = stonedResult;

            // 2. إطلاق التفكير الخلفي الصريح في نفس الوقت (بشكل غير متزامن)
            timerInfo.style.display = 'block';
            let randomDelay = Math.floor(Math.random() * (40 - 15 + 1)) + 15; // زمن عشوائي بين 15 و 40 ثانية
            countdownSpan.innerText = randomDelay;

            // كود العداد التنازلي لمحاكاة زوال التأثير تدريجياً
            const interval = setInterval(() => {
                randomDelay--;
                countdownSpan.innerText = randomDelay;
                if(randomDelay <= 0) {
                    clearInterval(interval);
                }
            }, 1000);

            // انتهاء زمن الانتشاء العشوائي خلف الكواليس
            setTimeout(async () => {
                statusBadge.innerText = 'جاري الانتقال للوعي الكامل وتحديث النص...';
                try {
                    const soberResult = await callOpenAI(apiKey, soberPrompt, question, 0.0);
                    
                    // تحديث نفس مكان المحادثة الأولى بالإجابة الحقيقية الصريحة!
                    statusBadge.className = 'status-badge status-sober';
                    statusBadge.innerText = 'الحالة الحالية: واعي تماماً / خارج التأثير (Sober State)';
                    responseOutput.className = 'response-area sober';
                    responseOutput.innerText = soberResult;
                    timerInfo.style.display = 'none';
                    sendBtn.disabled = false;
                } catch (err) {
                    responseOutput.innerText += `\n\n[خطأ في مسار الوعي الخلفي]: ${err.message}`;
                    sendBtn.disabled = false;
                }
            }, randomDelay * 1000);

        } catch (error) {
            responseOutput.innerText = `حدث خطأ في النظام: ${error.message}`;
            sendBtn.disabled = false;
        }
    }
</script>

</body>
</html>
